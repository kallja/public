name: Deploy ble-tpms-decoder to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'ble-tpms-decoder/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
        working-directory: ble-tpms-decoder

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages lets browsers cache files for 10 minutes; a per-commit query
      # string keeps index.html and decoder.js in step after a deploy.
      - name: Version the decoder import
        run: sed -i "s|'./decoder.js'|'./decoder.js?v=${GITHUB_SHA::7}'|" ble-tpms-decoder/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ble-tpms-decoder
      - id: deployment
        uses: actions/deploy-pages@v4
